<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil | Nohan HA-HONG-LAC — Portfolio SISR</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --bg-dark: #09090b;
            --card-bg: rgba(20, 20, 24, 0.75);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 40%, rgba(212, 175, 55, 0.07), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(212, 175, 55, 0.06), transparent 30%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* BARRE DE NAVIGATION MODERNE */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            padding: 1.1rem 1.8rem;
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            margin-bottom: 2.2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .brand-title span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.55rem 1rem;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
